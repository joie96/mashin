[package]
name = "mashin_playback_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
once_cell = "1.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "time"] }
sendspin = { git = "https://github.com/Sendspin/sendspin-rs", package = "sendspin" }
cpal = "0.18.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
