name: Build All Platforms
run-name: Manual build ${{ inputs.version || 'release.json' }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Shared version (empty uses release.json, e.g. 0.1.0-dev.1)'
        type: string
        required: false
      build_number:
        description: 'Shared build number (empty uses release.json; increase for Android updates)'
        type: string
        required: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.5'
  RUST_VERSION: '1.98.1'
  CARGO_NDK_VERSION: '4.1.2'

defaults:
  run:
    shell: powershell

jobs:
  prepare:
    name: Resolve Shared Release Identity
    runs-on: windows-2022
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      build_number: ${{ steps.release.outputs.build_number }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Check Out Selected Branch Or Tag
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve Version And Check Android Signing Prerequisites
        id: release
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
          KEYSTORE_BASE64: ${{ secrets.MASHIN_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MASHIN_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MASHIN_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MASHIN_ANDROID_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $buildNumber = 0
          if ($env:BUILD_NUMBER_INPUT) {
            if (-not [int]::TryParse($env:BUILD_NUMBER_INPUT, [ref]$buildNumber) -or $buildNumber -lt 1) {
              throw 'Build number must be a positive integer.'
            }
          }
          $release = & ./scripts/release/get_release_metadata.ps1 -Version $env:VERSION_INPUT -BuildNumber $buildNumber
          foreach ($name in @('KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw 'Configure all four MASHIN_ANDROID_* signing secrets before building all platforms; see docs/releases.md.'
            }
          }
          try { $keyBytes = [Convert]::FromBase64String($env:KEYSTORE_BASE64) } catch { throw 'Android keystore secret must be valid Base64.' }
          if ($keyBytes.Length -eq 0) { throw 'Android keystore is empty.' }
          $commit = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve source commit.' }
          $output = "version=$($release.Version)`nbuild_number=$($release.BuildNumber)`ntag=$($release.Tag)`ncommit=$commit`n"
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, $output, [Text.UTF8Encoding]::new($false))

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
            flutter_architecture: x64
            rust_target: x86_64-pc-windows-msvc
          - target: windows-arm64
            runner: windows-11-arm
            flutter_architecture: x64
            rust_target: aarch64-pc-windows-msvc
          - target: android-arm64
            runner: windows-2022
            flutter_architecture: x64
            rust_target: aarch64-linux-android
    steps:
      - name: Check Out Shared Source Commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: ${{ matrix.flutter_architecture }}
      - name: Set Up Rust And LLVM
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          $ErrorActionPreference = 'Stop'
          & rustup toolchain install $env:RUST_VERSION --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }
          & rustup default $env:RUST_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed.' }
          & rustup target add $env:RUST_TARGET
          if ($LASTEXITCODE -ne 0) { throw 'Rust target installation failed.' }
          $llvm = Join-Path $env:ProgramFiles 'LLVM/bin'
          if (-not (Test-Path (Join-Path $llvm 'clang-cl.exe'))) { throw 'Runner LLVM installation is missing.' }
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$llvm`n", [Text.UTF8Encoding]::new($false))
      - name: Set Up Android Java
        if: matrix.target == 'android-arm64'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set Up Android SDK
        if: matrix.target == 'android-arm64'
        uses: android-actions/setup-android@v3
      - name: Install Android Native Toolchain
        if: matrix.target == 'android-arm64'
        run: |
          $ErrorActionPreference = 'Stop'
          $configuration = Get-Content ./scripts/build/ffmpeg.json -Raw | ConvertFrom-Json
          & sdkmanager --install "ndk;$($configuration.androidNdkVersion)"
          if ($LASTEXITCODE -ne 0) { throw 'Android NDK installation failed.' }
          & cargo install cargo-ndk --version $env:CARGO_NDK_VERSION --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo-ndk installation failed.' }
      - name: Resolve Flutter Dependencies
        run: |
          & flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Flutter dependency resolution failed.' }
      - name: Build Windows Package
        if: matrix.target != 'android-arm64'
        env:
          BUILD_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: ./scripts/release/build_release.ps1 -Target $env:BUILD_TARGET -Version $env:RELEASE_VERSION -BuildNumber ([int]$env:RELEASE_BUILD_NUMBER)
      - name: Build Signed Android Package
        if: matrix.target == 'android-arm64'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          KEYSTORE_BASE64: ${{ secrets.MASHIN_ANDROID_KEYSTORE_BASE64 }}
          MASHIN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MASHIN_ANDROID_KEYSTORE_PASSWORD }}
          MASHIN_ANDROID_KEY_ALIAS: ${{ secrets.MASHIN_ANDROID_KEY_ALIAS }}
          MASHIN_ANDROID_KEY_PASSWORD: ${{ secrets.MASHIN_ANDROID_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $keystore = Join-Path $env:RUNNER_TEMP 'mashin-release.jks'
          try {
            [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
            $env:MASHIN_ANDROID_KEYSTORE = $keystore
            & ./scripts/release/build_release.ps1 -Target android-arm64 -Version $env:RELEASE_VERSION -BuildNumber ([int]$env:RELEASE_BUILD_NUMBER)
          } finally {
            Remove-Item $keystore -Force -ErrorAction SilentlyContinue
            Remove-Item Env:MASHIN_ANDROID_KEYSTORE -ErrorAction SilentlyContinue
          }
      - name: Upload Platform Package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            build/releases/${{ needs.prepare.outputs.tag }}/${{ matrix.target }}/*.msi
            build/releases/${{ needs.prepare.outputs.tag }}/${{ matrix.target }}/*.apk
            build/releases/${{ needs.prepare.outputs.tag }}/${{ matrix.target }}/*.sha256
            build/releases/${{ needs.prepare.outputs.tag }}/${{ matrix.target }}/artifact.json

  collect:
    name: Collect Complete Build
    needs: [prepare, build]
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check Out Shared Source Commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Download All Three Platform Packages
        uses: actions/download-artifact@v4
        with:
          path: build/collected
      - name: Verify And Collect Shared Build
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: ./scripts/release/collect_release_artifacts.ps1 -InputDirectory ./build/collected -Version $env:RELEASE_VERSION -BuildNumber ([int]$env:RELEASE_BUILD_NUMBER) -Commit $env:RELEASE_COMMIT
      - name: Upload Complete Build
        uses: actions/upload-artifact@v4
        with:
          name: Mashin-${{ needs.prepare.outputs.tag }}-all-platforms
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: build/releases/${{ needs.prepare.outputs.tag }}/all